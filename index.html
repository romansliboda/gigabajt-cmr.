<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gigabajt robot 05 — poprawka</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3f9;font:16px system-ui,Arial;color:#173352;padding:17px}.wrap{max-width:820px;margin:auto}h1{font-size:24px;margin:8px 0}p{color:#64758b;line-height:1.45}.stage{background:#fff;border-radius:25px;padding:8px;box-shadow:0 12px 28px #6e87a624}.stage svg{display:block;width:100%;height:auto;aspect-ratio:800/450;touch-action:manipulation}.controls{display:flex;gap:9px;margin:12px 0;flex-wrap:wrap}button{background:#194576;color:white;border:0;border-radius:12px;padding:12px 16px;font:600 16px system-ui;cursor:pointer}.notice{background:#fff;border-radius:18px;padding:12px 15px;font-size:14px;color:#557089}.bubble{font-weight:750;fill:#255074;font-size:24px}.status{font-size:15px;fill:#68819a;font-weight:550}
#robotMover{transition:transform 2.5s ease-in-out}#headTurn{transition:transform 1s ease;transform-box:fill-box;transform-origin:center}#eyes{transition:transform .3s ease}#eyeL,#eyeR{transition:ry .12s ease,rx .12s ease}.fade{opacity:0;transition:opacity .25s ease}.visible{opacity:1}.tvLandscape{animation:tv 3s ease-in-out infinite}@keyframes tv{0%,100%{opacity:.96}50%{opacity:.75}}@media(prefers-reduced-motion:reduce){#robotMover,#headTurn{transition:none}.tvLandscape{animation:none}}
</style></head><body><main class="wrap"><h1>🤖 Gigabajt — robot 05 POPRAWKA</h1><p>Sprawdzamy samą unoszącą się głowę i telewizor pod kątem. Animacja działa bez WebGL i bez internetu.</p>
<div class="stage"><svg id="scene" viewBox="0 0 800 450" role="img" aria-label="Ruchoma głowa robocika obok pomarańczowego telewizora">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
 <linearGradient id="shell" x1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#f9fcff"/><stop offset=".78" stop-color="#d8e0ec"/><stop offset="1" stop-color="#afc0d1"/></linearGradient>
 <linearGradient id="face" x1="0" x2=".7" y2="1"><stop stop-color="#222b37"/><stop offset=".35" stop-color="#101923"/><stop offset="1" stop-color="#02050b"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1" y2="1"><stop stop-color="#f5d4a1"/><stop offset=".5" stop-color="#bb935d"/><stop offset="1" stop-color="#856546"/></linearGradient>
 <linearGradient id="tvbody" x1="0" x2="1" y2="1"><stop stop-color="#ffbd63"/><stop offset=".55" stop-color="#f68d20"/><stop offset="1" stop-color="#ce670d"/></linearGradient>
 <linearGradient id="screen" x1="0" x2="0" y2="1"><stop stop-color="#8be7ff"/><stop offset="1" stop-color="#2d91c2"/></linearGradient>
 <radialGradient id="eyesGlow"><stop stop-color="#87f7ff"/><stop offset=".72" stop-color="#31daff"/><stop offset="1" stop-color="#18aef5"/></radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="800" height="450" rx="21" fill="url(#bg)"/><rect y="360" width="800" height="90" fill="#f0f5fb"/><path d="M30 359H770" stroke="#e5edf7" stroke-width="3"/>
<g id="tv" transform="translate(560 165)">

 <path d="M8 47L25 30 170 25 194 46 196 183 174 198 23 197 8 180Z" fill="url(#tvbody)" stroke="#ca670f" stroke-width="4"/>
 <path d="M174 29L201 40 201 186 174 198Z" fill="#ba5b0d" opacity=".6"/>
 <rect x="25" y="51" width="128" height="113" rx="18" fill="#593f2c" stroke="#ad6225" stroke-width="3"/>
 <rect x="33" y="59" width="112" height="97" rx="13" fill="url(#screen)"/>

 <circle cx="175" cy="78" r="8" fill="#263848"/><circle cx="175" cy="107" r="8" fill="#263848"/><path d="M40 198l-3 13M166 196l5 15" stroke="#ae590b" stroke-width="10" stroke-linecap="round"/>
 <path d="M118 27l-20-29M118 27l27-33" stroke="#424951" stroke-width="4" stroke-linecap="round"/><circle cx="98" cy="-2" r="5" fill="#ed9d36"/><circle cx="145" cy="-6" r="5" fill="#ed9d36"/>
</g>
<g id="robotMover" transform="translate(125 105)">
 <ellipse cx="118" cy="251" rx="99" ry="18" fill="#8294a9" opacity=".28" filter="url(#shadow)"/>
 <g id="floating" transform="translate(0 0)">
 <g id="headTurn">
  <ellipse cx="48" cy="128" rx="25" ry="49" fill="url(#gold)" stroke="#7d6b5c" stroke-width="3"/><ellipse cx="206" cy="128" rx="25" ry="49" fill="url(#gold)" stroke="#7d6b5c" stroke-width="3"/>
  <rect x="41" y="33" width="176" height="184" rx="60" fill="url(#shell)" stroke="#c7d2df" stroke-width="3"/>
  <rect x="54" y="46" width="150" height="151" rx="49" fill="url(#face)" stroke="#495968" stroke-width="3"/>
  <path d="M79 62Q123 41 171 65" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="11" stroke-linecap="round"/>
  <g id="eyes"><ellipse id="eyeL" cx="103" cy="126" rx="24" ry="27" fill="url(#eyesGlow)"/><ellipse id="eyeR" cx="159" cy="126" rx="24" ry="27" fill="url(#eyesGlow)"/></g>
  <path d="M88 208Q127 221 169 205" stroke="#fbfdff" stroke-width="6" fill="none" opacity=".7"/>
 </g>
 </g>
</g>
<g id="greeting" class="fade"><rect x="253" y="28" width="298" height="65" rx="28" fill="#eaf5ff" stroke="#c6def6" stroke-width="3"/><text x="402" y="70" class="bubble" text-anchor="middle">Cześć, co słychać?</text></g>
<text x="400" y="431" class="status" id="status" text-anchor="middle">Ogląda telewizor</text>
</svg></div>
<div class="controls"><button id="tvBtn">📺 Telewizor</button><button id="driveBtn">↔️ Ruch po pokoju</button><button id="helloBtn">👋 Przywitanie</button></div><div class="notice">Test 05 — poprawka pustej sceny. Głowa i telewizor są widoczne bez WebGL; animacja pozostaje oddzielna od aplikacji CMR.</div>
